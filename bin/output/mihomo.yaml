    type: select
    include-all: true
    filter: (?i)(?=.*GPT⁺)(?=.*YT)
  - name: "\U0001F680 手动切换"
    include-all: true
    type: select
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: (?i)(?=.*GPT)
    interval: 300
    tolerance: 50
  - name: "\U0001F4F2 电报消息"
